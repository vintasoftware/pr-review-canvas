<div class="scene" data-technique="dependency-matrix">
  <div class="dm">
    <span class="dm-corner">imports of</span>
    <span class="dm-col bad" style="grid-area: 1 / 3"><code><span>server/</span><span>app-render/</span><span>types</span></code></span>
    <span class="dm-col good" style="grid-area: 1 / 4"><code><span>shared/lib/</span><span>app-router-types</span></code><b>new</b><span class="dm-toy"><code>FlightRouterState</code> + 20 types moved here</span></span>
    <span class="dm-browser"><span>browser chunks</span></span>
    <span class="dm-row" style="grid-row: 2">client</span>
    <span class="dm-c rm dm-hero" style="grid-area: 2 / 3"><s>40</s>→ 0</span>
    <span class="dm-c add" style="grid-area: 2 / 4">56</span>
    <span class="dm-row" style="grid-row: 3">shared</span>
    <span class="dm-c rm" style="grid-area: 3 / 3"><s>4</s>→ 0</span>
    <span class="dm-c add" style="grid-area: 3 / 4">4</span>
    <span class="dm-row" style="grid-row: 4">server</span>
    <span class="dm-c chg" style="grid-area: 4 / 3"><s>19</s>→ 13</span>
    <span class="dm-c add" style="grid-area: 4 / 4">9</span>
  </div>
  <style>
    .dm { --mono: ui-monospace, SFMono-Regular, Menlo, monospace; display: grid; grid-template-columns: 2rem 6rem 14rem 14rem; grid-template-rows: auto repeat(3, 4.4rem); gap: 0.5rem; align-items: end; margin: 0 auto; padding-top: 0.9rem; }
    .dm-corner { grid-area: 1 / 1 / 2 / 3; justify-self: end; padding-right: 0.4rem; font-size: 0.8rem; color: var(--muted); }
    .dm-col { display: flex; flex-direction: column; align-items: center; gap: 0.15rem; text-align: center; color: var(--c); }
    .dm-col code { font: 700 0.88rem var(--mono); color: var(--fg); background: none; }
    .dm-col code span { display: inline-block; white-space: nowrap; }
    .dm-col b { font-size: 0.8rem; }
    .dm-toy { display: flex; flex-direction: column; align-items: center; gap: 0.15rem; margin-top: 0.35rem; font-size: 0.8rem; font-weight: 600; }
    .dm-toy code { font: 700 0.8rem var(--mono); color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--paper)); padding: 0.05rem 0.3rem; border-radius: 0.25rem; }
    .dm-browser { grid-area: 2 / 1 / 4 / 2; align-self: stretch; display: grid; place-items: center; border-left: 0.14rem solid var(--muted); border-radius: 0.3rem 0 0 0.3rem; border-top: 0.14rem solid var(--muted); border-bottom: 0.14rem solid var(--muted); }
    .dm-browser span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 0.78rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
    .dm-row { grid-column: 2; justify-self: end; align-self: center; padding-right: 0.4rem; font-weight: 700; }
    .dm-c { align-self: stretch; display: flex; align-items: center; justify-content: center; gap: 0.4rem; border-radius: 0.4rem; font-size: 1.35rem; font-weight: 750; font-variant-numeric: tabular-nums; }
    .dm-c s { font-size: 1rem; font-weight: 600; opacity: 0.7; }
    .dm-c.add { color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--paper)); box-shadow: inset 0 0 0 0.12rem var(--good); }
    .dm-c.rm { color: var(--bad); background: color-mix(in srgb, var(--bad) 6%, var(--paper)); outline: 0.12rem dashed var(--bad); outline-offset: -0.12rem; }
    .dm-c.chg { color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--paper)); box-shadow: inset 0 0 0 0.12rem var(--warn); }
    .dm-hero { outline-width: 0.2rem; font-size: 1.6rem; box-shadow: 0 0 0 0.3rem color-mix(in srgb, var(--bad) 20%, transparent), 0 0 1.2rem color-mix(in srgb, var(--bad) 45%, transparent); animation: dm-glow 2.4s ease-in-out infinite; }
    @keyframes dm-glow { 50% { box-shadow: 0 0 0 0.4rem color-mix(in srgb, var(--bad) 12%, transparent), 0 0 1.8rem color-mix(in srgb, var(--bad) 55%, transparent); } }
    @media (max-width: 40rem) {
      .dm { grid-template-columns: 1.4rem 3.6rem minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto repeat(3, 3.6rem); gap: 0.35rem; width: 100%; }
          .dm-corner { display: none; }
      .dm-col code, .dm-toy, .dm-toy code { font-size: 0.75rem; }
      .dm-row { padding-right: 0.2rem; font-size: 0.85rem; }
      .dm-c { font-size: 1.1rem; }
      .dm-hero { font-size: 1.25rem; }
      .dm-c s { font-size: 0.85rem; }
    }
  </style>
</div>
