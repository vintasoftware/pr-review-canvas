# Copy to <repo root>/pr-review.config.yml. Every key is optional.
version: 1

# Markdown reference for project standards. The generation mode controls how the generator uses it.
# rulebook: docs/CODE_REVIEW.md

# Optional full-template replacements, resolved from this project's root.
# Commit these files with this config. Omitted entries use the installed defaults.
# prompts:
#   generation-format.md: review-prompts/generation-format.md
#   generation-strict.md: review-prompts/generation-strict.md
#   generation-surfacing.md: review-prompts/generation-surfacing.md
#   quality-standards.md: review-prompts/quality-standards.md
#   layering-guidance.md: review-prompts/layering-guidance.md
#   chat-seed.md: review-prompts/chat-seed.md

# Optional layer guidance. Omit or leave empty for agent-chosen semantic sections.
layers: []
# layers:
#   - id: checkout
#     title: Checkout
#     description: Cart totals, payment processing, and order creation.
#     paths: ['src/checkout/**']

# Blast radius tags. Glob patterns against changed paths; the label shows in the header and the rail.
highRisk:
  - pattern: '**/migrations/**'
    label: schema
  - pattern: '**/*auth*'
    label: auth

generation:
  mode: strict # strict: quality review; surfacing: walkthrough that audits as it reads
  maxRepairRounds: 3 # publish retries the skill may make after a failed validation
  inlineDiffMaxLines: 1500 # diffs longer than this are read per file instead of inlined in the prompt
  smallPrHunks: 10 # at most this many hunks: one layer unless concerns differ, fewer annotations
  # models:                # the model each agent generates canvases with, keyed by agent id;
  #   claude: opus         # the default; any other agent with no entry keeps the session's model
  #   codex: gpt-6-sol     # AI Chat ignores this map
  # caps:                  # override the text caps (characters)
  #   summary: 1800
  #   rationale: 300
  #   diagram: 1500       # mermaid source, counted raw

# Which paths count as tests, for the layering rules, the `test` pill on a file card, and the
# light reading level, which keeps test titles on screen. The defaults below match test
# directories and file-name shapes across stacks (JS/TS, Python, Go, Ruby, Java, Kotlin, PHP,
# C#, Swift, Elixir, Dart, Rust). A list here replaces them; add `'**/spec/**'` when that
# directory holds tests in your repository. Snapshots and fixtures inside test paths may still
# hide at light, since they are generated.
tests:
  patterns:
    - '**/__tests__/**'
    - '**/tests/**'
    - '**/test/**'
    - '**/*.test.*'
    - '**/*.spec.*'
    - '**/*_test.*'
    - '**/*_spec.*'
    - '**/test_*.py'
    - '**/conftest.py'
    - '**/*Test.java'
    - '**/*Tests.java'
    - '**/*Test.kt'
    - '**/*Tests.kt'
    - '**/*Test.scala'
    - '**/*Tests.scala'
    - '**/*Test.groovy'
    - '**/*Tests.groovy'
    - '**/*Test.cs'
    - '**/*Tests.cs'
    - '**/*Test.fs'
    - '**/*Tests.fs'
    - '**/*Test.vb'
    - '**/*Tests.vb'
    - '**/*Test.swift'
    - '**/*Tests.swift'
    - '**/*Test.php'
    - '**/*Tests.php'

# The chat agent and model are personal (chatAgent and chatModel in .pr-review/settings.yml)
# and do not affect canvas generation, which generation.models sets.
chat:
  enabled: true # false removes the chat pane and its routes

canvas:
  # A canvas stays current for a later head whose diff is identical to the one it was generated
  # from, as after merging the base branch in. Set false to mark the canvas outdated on every new
  # commit.
  keepForIdenticalDiff: true
  # Regenerating a canvas for a new head starts from the newest canvas of a commit the head was
  # built on, keeping the layers, folds, notes and attention points its diff leaves untouched.
  # Set false to generate every canvas from a blank page, as `--force` always does.
  incremental: true
